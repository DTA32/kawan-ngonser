<div id="kn-splash">
  <div class="kn-splash-badge">
    <!-- lucide audio-lines — same mark as the app header brand -->
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 10v3" /><path d="M6 6v11" /><path d="M10 3v18" /><path d="M14 8v7" /><path d="M18 5v13" /><path d="M22 10v3" />
    </svg>
  </div>
</div>
<script>
  // Apply the persisted theme class before first paint (G-5c). The color-mode
  // module takes over once the app boots; this covers the splash window.
  (function () {
    try {
      var stored = window.localStorage.getItem('nuxt-color-mode')
      var mode = stored === 'light' || stored === 'dark' ? stored : null
      if (!mode) {
        // System preference; fall back to dark when undetectable (G-5b)
        mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark'
      }
      document.documentElement.classList.add(mode)
      var bg = mode === 'light' ? '#FAFAFC' : '#0F1017'
      document.documentElement.style.backgroundColor = bg
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', bg)
    } catch (e) { /* default dark styling below still applies */ }
  })()
</script>
<style>
  #kn-splash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0F1017;
  }
  html.light #kn-splash { background: #FAFAFC; }
  .kn-splash-badge {
    width: 96px;
    height: 96px;
    border-radius: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: linear-gradient(45deg, #7C5CFF, #C94FD6);
  }
</style>

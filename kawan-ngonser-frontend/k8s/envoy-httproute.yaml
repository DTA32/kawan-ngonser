# Envoy Gateway equivalent of ingress.yaml (kept alongside it for review).
# kawan-ngonser.dta32.my.id/ -> FE. Shares the host with the BE (/api), like bdgcafe.
# Route in `envoy` ns -> backend Service in `default` (see ReferenceGrant).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kawan-ngonser-fe
  namespace: envoy
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy
      sectionName: kawan
  hostnames:
    - kawan-ngonser.dta32.my.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kawan-ngonser-fe-service
          namespace: default
          port: 80
